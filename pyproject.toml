[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceship-titanic"
version = "0.1.0"
description = "Spaceship Titanic — Kaggle classification project"
requires-python = ">=3.12"
dependencies = [
    # Core ML
    "pandas==2.2.2",
    "numpy==2.2.6",
    "scikit-learn==1.8.0",
    "lightgbm==4.6.0",
    "xgboost==3.2.0",
    "catboost==1.2.10",
    "tabpfn==7.1.1",
    "optuna==4.8.0",
    "joblib==1.4.0",
    # Visualizacion
    "plotly>=5.0",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    # Tracking
    "mlflow==2.17.2",
    # Utils
    "tqdm",
    "python-dotenv==1.0.1",
    # Notebooks
    "ipykernel",
    "nbformat",
    "nbconvert",
    "papermill",
    "pylint>=4.0.5",
    "tabulate>=0.10.0",
    "shap>=0.51.0",
    "pytorch-tabnet>=4.1.0",
]

[project.scripts]
spaceship = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
# strict desactivado: catboost/lightgbm/xgboost no tienen stubs completos

[tool.pylint.main]
min-similarity-lines = 10

[tool.pylint.messages_control]
disable = ["missing-module-docstring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
